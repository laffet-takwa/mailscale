name: Worker CI

on:
  push:
    branches: [main]
    paths: ['worker-kotlin/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker-kotlin/**', '.github/workflows/worker.yml']

jobs:
  build:
    name: Compile, detekt, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installDist
        run: ./gradlew -p worker-kotlin installDist

      - name: Detekt
        run: ./gradlew -p worker-kotlin detekt

      - name: Kotlin style
        run: ./gradlew -p worker-kotlin spotlessCheck

      - name: Unit tests
        run: ./gradlew -p worker-kotlin test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-test-report
          path: worker-kotlin/build/reports/tests/**
