name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend-java/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend-java/**', '.github/workflows/backend.yml']

jobs:
  build:
    name: Compile, verify, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build package (tests skipped)
        run: ./mvnw -B -f backend-java/pom.xml package -DskipTests

      - name: Checkstyle
        run: ./mvnw -B -f backend-java/pom.xml checkstyle:check

      - name: Unit + H2 integration tests
        run: ./mvnw -B -f backend-java/pom.xml test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend-java/target/surefire-reports/**
